name: forcare

services:
  db:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-forcare}
      POSTGRES_USER: ${POSTGRES_USER:-forcare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    mem_limit: 256m

  backend:
    build:
      context: ./backend
      target: runtime
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-forcare}
      POSTGRES_USER: ${POSTGRES_USER:-forcare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-30000}
      AUTH_ALLOWED_ORIGINS: ${AUTH_ALLOWED_ORIGINS:?Set exact allowed origin(s) in .env}
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:?Set a 32+ character session secret in .env}
      AUTH_NURSE_EMAIL_DOMAIN: ${AUTH_NURSE_EMAIL_DOMAIN:-}
      AUTH_LOCAL_HTTP_TEST: ${AUTH_LOCAL_HTTP_TEST:-false}
      LANGSMITH_TRACING: "false"
      LANGCHAIN_TRACING_V2: "false"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3001}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "const r = await fetch('http://127.0.0.1:3000/health/ready', { signal: AbortSignal.timeout(3000) }); process.exit(r.ok ? 0 : 1)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    mem_limit: 384m

volumes:
  postgres_data:
